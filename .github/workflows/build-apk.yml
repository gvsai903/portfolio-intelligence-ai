name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${{ github.workspace }}/android-sdk"
          export ANDROID_SDK_ROOT="${{ github.workspace }}/android-sdk"

          # `yes` can receive SIGPIPE when sdkmanager exits after accepting licenses.
          # Temporarily disable pipefail so the expected broken pipe does not fail the job
          # while still checking the real sdkmanager exit status below.
          set +o pipefail
          yes 2>/dev/null | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdk_status=$?
          set -o pipefail

          if [ "$sdk_status" -ne 0 ]; then
            echo "ERROR: Failed to accept Android SDK licenses." >&2
            exit "$sdk_status"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${{ github.workspace }}/android-sdk"
          export ANDROID_SDK_ROOT="${{ github.workspace }}/android-sdk"
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK file was not generated at app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioIntelligenceAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
